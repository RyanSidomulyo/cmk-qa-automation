name: QA Automation — Production

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run QA tests — Production
        id: run_tests
        run: |
          TEST_ENV=production npx playwright test --project=frankco
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Get test summary
        id: summary
        if: always()
        run: |
          if [ -f "qa-report.html" ]; then
            # Ambil ringkasan dari output playwright
            PASSED=$(grep -o '[0-9]* passed' playwright-report/results.json 2>/dev/null || echo "?")
            echo "report_exists=true" >> $GITHUB_OUTPUT
          fi
          NOW=$(date "+%d %B %Y %H:%M UTC")
          echo "timestamp=$NOW" >> $GITHUB_OUTPUT

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            qa-report.html
          retention-days: 7

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[CMK QA PRODUCTION] ${{ steps.run_tests.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }} — Frank & Co Run #${{ github.run_number }}"
          to: sidomulyo784@gmail.com
          from: sidomulyo784@gmail.com
          body: |
            ========================================
            CMK QA Automation — Production Report
            ========================================
            Status  : ${{ steps.run_tests.outcome == 'success' && '✅ PASSED' || '❌ FAILED' }}
            Run     : #${{ github.run_number }}
            Waktu   : ${{ steps.summary.outputs.timestamp }}
            Website : https://frankandcojewellery.com
            
            Detail hasil test:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Download report lengkap (HTML):
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
            ========================================
